# Werkmeister service-registry fragment for this repo.
#
# `werkmeister registry sync` (run by `werkmeister machine setup`) merges every
# <repo>/.werkmeister/services.yaml under paths.repos_root into
# ~/.werkmeister/services.yaml. Only `services:`, `setup_services:` and
# `infrastructure:` may appear here; `repo:` is the checkout's directory name
# and `repos:` is derived. Generated by `werkmeister machine detect`; re-running it only
# adds what is missing, so edit freely.

services:
  code-practice-test:
    path: .
    type: api # guessed: no package.json — assumed a service
    internal_port: 3000 # guessed: no port in any source — default 3000
    port_offset: 3
    health_endpoint: "" # inferred by Claude: The container sits idle running sleep infinity, and no Python file starts an HTTP server, so there is no health path.
    image: python:3.14-slim
    command: sleep infinity # inferred by Claude: Dockerfile CMD sleeps on purpose so you can open a shell with docker compose exec, and docker-compose.yml mounts .:/app for local development.
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codetest

infrastructure:
  postgres:
    k8s_forward_port: 9054
    internal_port: 5432
    k8s_namespace: default # guessed: no k8s manifest for this datastore
    k8s_pod_prefix: postgres # guessed: no k8s manifest for this datastore
    health_endpoint: postgres
