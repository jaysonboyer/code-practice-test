# Werkmeister service-registry fragment for this repo.
#
# `werkmeister registry sync` (run by `werkmeister machine setup`) merges every
# <repo>/.werkmeister/services.yaml under paths.repos_root into
# ~/.werkmeister/services.yaml. Only `services:`, `setup_services:` and
# `infrastructure:` may appear here; `repo:` is the checkout's directory name
# and `repos:` is derived. Generated by `werkmeister machine detect`; re-running it only
# adds what is missing, so edit freely.

services:
  code-practice-test:
    path: .
    type: cli # idle: werkmeister keeps it on `sleep infinity` for `docker exec` sessions
    internal_port: 3000 # nothing listens; the schema requires a port
    port_offset: 3
    health_endpoint: ""
    image: code-practice-test:local # local tag, built from the Dockerfile (python 3.14 + psycopg2)
    dockerfile: Dockerfile
    # Task 1 asserts, then seeds and runs the Task 3 SQL against postgres. The wait
    # loop is there because werkmeister's generated healthcheck can't tell when postgres is ready.
    test: >-
      for i in $(seq 30); do python -c "import sys, psycopg2; psycopg2.connect(sys.argv[1]).close()" "$DATABASE_URL" 2>/dev/null && break; sleep 1; done;
      python task-runner.py
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codetest

  # Same database as the repo's docker-compose.yml; the feature-network alias
  # `postgres` is the host in DATABASE_URL.
  postgres:
    path: .
    type: api # not idle, so the image's own CMD (postgres) runs
    internal_port: 5432
    port_offset: 9 # free in every fragment under ~/repos, disabled ones included
    health_endpoint: ""
    image: postgres:9.4 # Task 3 must run on 9.4
    test: "none: stock image; code-practice-test's task-runner.py exercises it"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codetest
    extra_volumes:
      - ${REPO}/task_3_and_4/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
