services:
  postgres:
    image: postgres:9.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codetest
    ports:
      - "5433:5432" # 5433 on the host so it doesn't clash with Homebrew postgres@14
    volumes:
      - ./task_3_and_4/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./task_3_and_4:/task_3_and_4:ro
    healthcheck:
      # -h localhost: the image's first-run setup server only listens on a socket, so this waits for the real one
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "codetest"]
      interval: 2s
      retries: 30

  python:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codetest
    volumes:
      - .:/app # edits on the host show up in the container straight away
